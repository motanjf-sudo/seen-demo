:root {
  --bg: #f1f5f6; --surface: #ffffff; --ink: #10242b; --muted: #55676d; --line: #d3dde0;
  --accent: #0b6b7a; --accent-ink: #ffffff; --accent-soft: #dff0f2;
  --ok: #1b7448; --ok-soft: #e1f3e8; --warn: #975600; --warn-soft: #fbeed6; --bad: #b3261e; --bad-soft: #fbe5e3;
  --font: "Vazirmatn", "IRANSans", Tahoma, system-ui, sans-serif;
  --r: 14px; color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1618; --surface: #162125; --ink: #e7eff1; --muted: #9db0b5; --line: #2a3a3f;
  --accent: #52c2d0; --accent-ink: #05262b; --accent-soft: #11333a;
  --ok: #6ed09a; --ok-soft: #133423; --warn: #efb257; --warn-soft: #392b10; --bad: #ff8b81; --bad-soft: #401f1c; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1618; --surface: #162125; --ink: #e7eff1; --muted: #9db0b5; --line: #2a3a3f;
  --accent: #52c2d0; --accent-ink: #05262b; --accent-soft: #11333a;
  --ok: #6ed09a; --ok-soft: #133423; --warn: #efb257; --warn-soft: #392b10; --bad: #ff8b81; --bad-soft: #401f1c; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
html { -webkit-tap-highlight-color: transparent; }
button, .btn, .chip, label.check { touch-action: manipulation; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.75; direction: rtl; -webkit-text-size-adjust: 100%; }
h1, h2, h3 { margin: 0; line-height: 1.4; text-wrap: balance; }
h1 { font-size: 1.35rem; font-weight: 800; } h2 { font-size: 1.15rem; font-weight: 750; } h3 { font-size: 1rem; font-weight: 700; }
p { margin: 0; } a { color: var(--accent); }
.num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; display: inline-block; }
.muted { color: var(--muted); } .small { font-size: .88rem; } .center { text-align: center; }
.stack { display: flex; flex-direction: column; gap: 14px; } .stack-s { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; } .row > .grow { flex: 1 1 0; min-width: 0; } .between { justify-content: space-between; }

/* صفحه ورود */
.hero { margin-top: 6vh; text-align: center; align-items: stretch; } .hero .logo { width: 72px; height: 72px; border-radius: 18px; margin: 0 auto 4px; display: block; }

/* پوسته اپ بیمار */
.app { max-width: 520px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top)); }
.brand { font-weight: 800; font-size: 1rem; color: var(--accent); }
.who { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 4px 14px; font: inherit; font-size: .92rem; font-weight: 700; cursor: pointer; max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.view { flex: 1; padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 16px; }
.tabs { position: sticky; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.tabs button { background: none; border: 0; font: inherit; font-size: .82rem; font-weight: 600; color: var(--muted); padding: 8px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
.tabs button svg { width: 24px; height: 24px; } .tabs button[aria-current="true"] { color: var(--accent); }
.banner { padding: 8px 16px; font-size: .88rem; background: var(--warn-soft); color: var(--warn); text-align: center; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.card.tone-ok { background: var(--ok-soft); border-color: transparent; } .card.tone-warn { background: var(--warn-soft); border-color: transparent; }
.card.tone-bad { background: var(--bad-soft); border-color: transparent; } .card.tone-accent { background: var(--accent-soft); border-color: transparent; }

.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-weight: 700; border-radius: 12px; padding: 12px 18px; min-height: 52px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; text-align: center; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); } .btn.big { min-height: 64px; font-size: 1.15rem; width: 100%; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; } .btn.danger-line { border-color: var(--bad); color: var(--bad); border-width: 2px; }
.btn.block { width: 100%; } .btn.sm { min-height: 38px; padding: 6px 12px; font-size: .9rem; border-radius: 10px; } .btn.ghost { border-color: transparent; background: none; color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

label.f { display: flex; flex-direction: column; gap: 4px; font-weight: 650; font-size: .95rem; }
input[type="text"], input[type="tel"], input[type="number"], input[type="password"], input[type="date"], input[type="time"], select, textarea {
  font: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 50px; width: 100%; }
input.bp { font-size: 2rem; font-weight: 800; text-align: center; direction: ltr; min-height: 72px; font-variant-numeric: tabular-nums; padding: 6px; }
.bp-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; } .bp-grid label.f { text-align: center; font-size: .9rem; }
.err { color: var(--bad); font-weight: 700; } .okmsg { color: var(--ok); font-weight: 700; }
.check { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; }
.check input { width: 24px; height: 24px; margin-top: 4px; flex: none; accent-color: var(--accent); } .check.severe { border-color: var(--bad); }

.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 12px; font-size: .85rem; font-weight: 700; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }

<body>
<div class="demo-switch noprint"><span>نسخه نمایشی با داده نمونه</span><button data-v="pv" aria-current="true">نمای بیمار</button><button data-v="cv">نمای کلینیک</button><button data-v="sv">پیامک‌ها</button></div>
<div id="pv"></div>
<div id="cv" hidden></div>
<div id="sv" hidden></div>
<script>
/* موتور محاسبه HBPM — کلینیک فشار خون سین
 * پروفایل CLINIC_NAJAFI_2026 (تصمیم‌های D1–D3 دکتر نجفی + پاسخ‌های ۱۳ نوامبر ۲۰۲۶)
 * این فایل هم در سرور (Node) و هم در مرورگر اجرا می‌شود تا اپ بیمار آفلاین هم همان قواعد را داشته باشد.
 */
(function (root) {
  'use strict';

  var TZ_OFFSET_MIN = 210; // Asia/Tehran = UTC+03:30 (از ۱۴۰۱ بدون تغییر ساعت تابستانی)

  var DEFAULT_SETTINGS = {
    clinicName: 'کلینیک فشار خون سین',
    clinicPhone: '',
    onCallMobiles: [],
    // روزهای کاری به شماره‌گذاری جاوااسکریپت: شنبه=6، یکشنبه=0 … چهارشنبه=3
    hours: { days: [6, 0, 1, 2, 3], from: 8, to: 20 },
    windows: { amFrom: 300, amTo: 660, pmFrom: 1020, pmTo: 1380 }, // ۵–۱۱ و ۱۷–۲۳ (دقیقه از نیمه‌شب)
    alert: { sbpHigh: 170, sbpLow: 80, restMin: 5, timeoutMin: 15 }, // D3
    limits: { sbp: [50, 300], dbp: [30, 200], pulse: [30, 220] },
    target: { sbpLo: 125, sbpHi: 135, dbpLo: 70, dbpHi: 80 }, // D2: ۱۲۵≤S<۱۳۵ و ۷۰≤D<۸۰
    diag: { sbp: 135, dbp: 85 },
    series: { defaultDays: 7, minDays: 4, maxDays: 7, defaultOffset: 21, minValidDays: 3, minReadings: 12 }, // D1
    restSec: 300,
    gapSec: 60,
    overMeasureDaysPerWeek: 3,
    preSeriesSmsHour: 18,
    llm: { url: '', key: '', model: '' },
    integrationKey: ''
  };

  // ---------- زمان و تاریخ (به وقت تهران) ----------
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function localParts(ms) {
    var d = new Date(ms + TZ_OFFSET_MIN * 60000);
    return {
      date: d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()),
      minutes: d.getUTCHours() * 60 + d.getUTCMinutes(),
      dow: d.getUTCDay()
    };
  }
  function dateToMs(dateStr, minutes) { // نیمه‌شب تهران + دقیقه
    var p = dateStr.split('-');
    return Date.UTC(+p[0], +p[1] - 1, +p[2]) - TZ_OFFSET_MIN * 60000 + (minutes || 0) * 60000;
  }
  function addDays(dateStr, n) { return localParts(dateToMs(dateStr, 720) + n * 86400000).date; }
  function diffDays(a, b) { return Math.round((dateToMs(a) - dateToMs(b)) / 86400000); }
  function seriesEnd(s) { return addDays(s.startDate, s.days - 1); }

  function isClinicOpen(ms, settings) {
    var h = (settings || DEFAULT_SETTINGS).hours, p = localParts(ms);
    return h.days.indexOf(p.dow) >= 0 && p.minutes >= h.from * 60 && p.minutes < h.to * 60;
  }

  // ---------- نوبت (صبح/عصر) ----------
  function slotFor(minutes, settings) {
    var w = (settings || DEFAULT_SETTINGS).windows;
    if (minutes >= w.amFrom && minutes < w.amTo) return { slot: 'MORNING', outOfWindow: false };
    if (minutes >= w.pmFrom && minutes < w.pmTo) return { slot: 'EVENING', outOfWindow: false };
    // خارج از پنجره: پذیرفته می‌شود، برچسب می‌خورد (پاسخ ۱۸)
    return { slot: (minutes >= w.amFrom - 120 && minutes < 840) ? 'MORNING' : 'EVENING', outOfWindow: true };
  }

  // ---------- اعتبارسنجی عدد (پاسخ ۲۶) ----------
  function validateReading(sbp, dbp, pulse, settings) {
    var L = (settings || DEFAULT_SETTINGS).limits;
    if (!isFinite(sbp) || !isFinite(dbp)) return 'EMPTY';
    if (sbp < L.sbp[0] || sbp > L.sbp[1]) return 'SBP_RANGE';
    if (dbp < L.dbp[0] || dbp > L.dbp[1]) return 'DBP_RANGE';
    if (sbp <= dbp) return 'SBP_LE_DBP';
    if (pulse != null && pulse !== '' && (pulse < L.pulse[0] || pulse > L.pulse[1])) return 'PULSE_RANGE';
    return null;
  }

  // D3: فقط سیستول
  function outOfRange(sbp, settings) {
    var a = (settings || DEFAULT_SETTINGS).alert;
    return sbp >= a.sbpHigh ? 'HIGH' : (sbp <= a.sbpLow ? 'LOW' : null);
  }

  function plannedPerOccasion(patient) {
    return patient && patient.modes && patient.modes.indexOf('AF') >= 0 ? 3 : 2;
  }

  function mean(arr, key) {
    if (!arr.length) return null;
    var s = 0; for (var i = 0; i < arr.length; i++) s += arr[i][key];
    return s / arr.length;
  }
  function bpMean(arr) {
    if (!arr.length) return null;
    var withPulse = arr.filter(function (r) { return r.pulse != null && r.pulse !== ''; });
    return { sbp: mean(arr, 'sbp'), dbp: mean(arr, 'dbp'), pulse: withPulse.length ? mean(withPulse, 'pulse') : null, n: arr.length };
  }

  // ---------- هدف مؤثر بیمار ----------
  function effectiveTarget(patient, settings) {
    var t = (settings || DEFAULT_SETTINGS).target;
    var it = patient && patient.individualTarget;
    if (it && isFinite(it.sbpHi)) {
      return { sbpLo: it.sbpLo, sbpHi: it.sbpHi, dbpLo: it.dbpLo, dbpHi: it.dbpHi, individual: true };
    }
    return { sbpLo: t.sbpLo, sbpHi: t.sbpHi, dbpLo: t.dbpLo, dbpHi: t.dbpHi, individual: false };
  }

  // ---------- طبقه‌بندی با عدد دقیق، بدون گردکردن (پاسخ ۲۲) ----------
  function classify(m, patient, settings) {
    settings = settings || DEFAULT_SETTINGS;
    var modes = (patient && patient.modes) || [];
    if (modes.indexOf('PREGNANCY') >= 0) {
      // بارداری: آستانه تشخیصی خانگی تعریف نشده؛ فقط قاعده «میانگین >۱۳۰/۸۰ → مشورت» (ISH-HDP)
      var consult = m.sbp > 130 || m.dbp > 80;
      return { mode: 'PREGNANCY', status: consult ? 'PREG_CONSULT' : 'PREG_OK' };
    }
    if (patient && patient.treated === false) {
      var d = settings.diag, high = m.sbp >= d.sbp || m.dbp >= d.dbp;
      return { mode: 'DIAGNOSIS', status: high ? 'HTN_RANGE' : 'BELOW_THRESHOLD', threshold: d };
    }
    var t = effectiveTarget(patient, settings);
    function comp(v, lo, hi) { return v >= hi ? 'ABOVE' : (lo != null && v < lo ? 'BELOW' : 'IN'); }
    var s = comp(m.sbp, t.sbpLo, t.sbpHi), dd = comp(m.dbp, t.dbpLo, t.dbpHi);
    // هر دو جزء باید در محدوده باشند (پاسخ ۲۴)؛ ۱۳۵ و ۸۰ خارج از هدف (پاسخ ۲۳)
    var status = (s === 'ABOVE' || dd === 'ABOVE') ? 'ABOVE' : ((s === 'BELOW' || dd === 'BELOW') ? 'BELOW' : 'IN_TARGET');
    return { mode: 'TREATED', status: status, sbp: s, dbp: dd, target: t };
  }

  // ---------- محاسبه یک سری (D1) ----------
  function computeSeries(series, readings, patient, settings, nowMs) {
    settings = settings || DEFAULT_SETTINGS;
    var S = settings.series, start = series.startDate, end = seriesEnd(series);
    var planned = plannedPerOccasion(patient);
    var today = localParts(nowMs == null ? Date.now() : nowMs);
    var inRange = readings.filter(function (r) {
      return !r.deleted && r.slot !== 'NIGHT' && r.localDate >= start && r.localDate <= end;
    }).sort(function (a, b) { return a.takenAt - b.takenAt; });

    var days = [];
    for (var i = 0; i < series.days; i++) {
      days.push({ date: addDays(start, i), index: i + 1, discarded: i === 0, am: [], pm: [], valid: false });
    }
    inRange.forEach(function (r) {
      var d = days[diffDays(r.localDate, start)];
      if (d) (r.slot === 'MORNING' ? d.am : d.pm).push(r);
    });

    var used = [], validDays = 0, q = { restSkipped: 0, outOfWindow: 0, singleOccasions: 0, missedOccasions: 0, extraReadings: 0, paper: 0, alerts: 0 };
    days.forEach(function (d) {
      var amDue = d.date < today.date || (d.date === today.date && today.minutes >= settings.windows.amTo);
      var pmDue = d.date < today.date;
      d.amMean = bpMean(d.am); d.pmMean = bpMean(d.pm);
      if (!d.discarded) {
        used = used.concat(d.am, d.pm);
        // روز معتبر = دست‌کم یک نوبت کامل (پاسخ ۲۰)
        d.valid = d.am.length >= planned || d.pm.length >= planned;
        if (d.valid) validDays++;
        if (amDue && !d.am.length) q.missedOccasions++;
        if (pmDue && !d.pm.length) q.missedOccasions++;
        [d.am, d.pm].forEach(function (o) {
          if (o.length > 0 && o.length < planned) q.singleOccasions++;
          if (o.length > planned) q.extraReadings += o.length - planned;
        });
      }
    });
    used.forEach(function (r) {
      if (r.restSkipped) q.restSkipped++;
      if (r.outOfWindow) q.outOfWindow++;
      if (r.source === 'PAPER') q.paper++;
      if (r.alertState) q.alerts++;
    });

    var status = today.date < start ? 'PLANNED' : (today.date > end ? 'ENDED' : 'ACTIVE');
    if (series.cancelled) status = 'CANCELLED';
    var lastDay = days[days.length - 1];
    var finished = status === 'ENDED' || (status === 'ACTIVE' && today.date === end && lastDay.pm.length >= planned);

    var res = {
      seriesId: series.id, startDate: start, endDate: end, daysPlanned: series.days, status: status, finished: finished,
      days: days, n: used.length, nAll: inRange.length, validDays: validDays, day1Discarded: true,
      valid: validDays >= S.minValidDays && used.length >= S.minReadings,
      need: { validDays: S.minValidDays, readings: S.minReadings },
      quality: q, planned: planned
    };
    if (used.length) {
      res.mean = bpMean(used);
      res.meanAM = bpMean(used.filter(function (r) { return r.slot === 'MORNING'; }));
      res.meanPM = bpMean(used.filter(function (r) { return r.slot === 'EVENING'; }));
      res.min = { sbp: Math.min.apply(null, used.map(function (r) { return r.sbp; })), dbp: Math.min.apply(null, used.map(function (r) { return r.dbp; })) };
      res.max = { sbp: Math.max.apply(null, used.map(function (r) { return r.sbp; })), dbp: Math.max.apply(null, used.map(function (r) { return r.dbp; })) };
    }
    // فقط سری معتبر طبقه‌بندی می‌شود (D1 قاعده ۴)
    res.classification = (res.valid && res.mean) ? classify(res.mean, patient, settings) : { status: 'INSUFFICIENT' };
    res.night = computeNight(series, readings);
    return res;
  }

  // فشار شبانه با دستگاه دارای حالت شب: دست‌کم ۲ شب و ۶ خوانش (ESH 2021 Box 26)؛ آستانه ≥۱۲۰/۷۰ (ISH 2026)
  function computeNight(series, readings) {
    var start = series.startDate, end = addDays(seriesEnd(series), 1);
    var nr = readings.filter(function (r) { return !r.deleted && r.slot === 'NIGHT' && r.nightDate >= start && r.nightDate <= end; });
    if (!nr.length) return null;
    var nights = {}; nr.forEach(function (r) { nights[r.nightDate] = 1; });
    var m = bpMean(nr), nNights = Object.keys(nights).length, valid = nr.length >= 6 && nNights >= 2;
    return { n: nr.length, nights: nNights, valid: valid, mean: m, high: valid ? (m.sbp >= 120 || m.dbp >= 70) : null };
  }

  // ---------- نوار «سایر راهنماها» (فقط نمای پزشک؛ تعارض‌ها نشان داده می‌شود، حل نمی‌شود) ----------
  function otherProfiles(res, patient, ageYears) {
    var m = res.mean, am = res.meanAM, pm = res.meanPM;
    if (!m) return [];
    function ge(x, s, d) { return x.sbp >= s || x.dbp >= d; }
    function lt(x, s, d) { return x.sbp < s && x.dbp < d; }
    var out = [];
    out.push({ id: 'ISH2026_OPTIMAL', name: 'ISH 2026 (OPTIMAL)',
      diagnosis: ge(m, 135, 85) ? 'فشار خون بالا (≥۱۳۵/۸۵)' : (ge(m, 130, 80) ? 'افزایش‌یافته (۱۳۰–۱۳۴/۸۰–۸۴)' : 'زیر آستانه'),
      target: lt(m, 130, 80) ? 'در هدف (<۱۳۰/۸۰)' : 'بالاتر از هدف (<۱۳۰/۸۰)' });
    out.push({ id: 'ESH_HBPM_2021', name: 'ESH-HBPM 2021',
      diagnosis: ge(m, 135, 85) ? 'فشار خون بالا (≥۱۳۵/۸۵)' : 'زیر آستانه',
      target: 'جدول ۱ (۱۲۵–۱۳۵/۷۰–۸۰): ' + ((m.sbp >= 125 && m.sbp <= 135 && m.dbp >= 70 && m.dbp <= 80) ? 'در محدوده' : 'خارج از محدوده') +
        ' · کادر ۱۷/۳۲ (سیستول ۱۲۵–۱۳۰، دیاستول <۸۰): ' + ((m.sbp >= 125 && m.sbp <= 130 && m.dbp < 80) ? 'در محدوده' : 'خارج از محدوده') });
    out.push({ id: 'ESH2023', name: 'ESH 2023', diagnosis: ge(m, 135, 85) ? 'فشار خون بالا (≥۱۳۵/۸۵)' : 'زیر آستانه', target: 'هدف خانگی عددی ندارد' });
    out.push({ id: 'ESC2024', name: 'ESC 2024',
      diagnosis: ge(m, 135, 85) ? 'فشار خون بالا (≥۱۳۵/۸۵)' : (lt(m, 120, 70) ? 'غیر افزایش‌یافته (<۱۲۰/۷۰)' : 'افزایش‌یافته (۱۲۰/۷۰ تا <۱۳۵/۸۵)'),
      target: 'هدف خانگی عددی ندارد' });
    out.push({ id: 'ACC_AHA_2025', name: 'ACC/AHA 2025',

        '<line x1="20" y1="88" x2="300" y2="88" stroke="var(--bad)" stroke-width="2" stroke-dasharray="6 5"/><text x="62" y="80" font-size="13" font-weight="800" fill="var(--bad)" text-anchor="middle">هم‌سطح قلب</text>' +

        '<text x="' + (286 - i * 40 - 13) + '" y="134" text-anchor="middle" font-size="14" font-weight="800" fill="' + (i ? 'var(--accent)' : 'var(--muted)') + '">' + fa(i + 1) + '</text>';
      return screen(214, 22, '۱۳۲', '۸۲') + screen(28, 22, '۱۲۸', '۷۸') + '<path d="M200 50h-70m10-8l-10 8 10 8" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>' +

        screen(20, 44, '۱۵۲', '۸۸') + '<path d="M212 72h-18m6-6l-6 6 6 6M126 72h-18m6-6l-6 6 6 6" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>' +
        '<g font-size="13" font-weight="800" text-anchor="middle"><text x="261" y="126" fill="var(--bad)">عدد بالا</text><text x="160" y="126" fill="var(--accent)">۵ دقیقه استراحت</text><text x="59" y="126" fill="var(--ok)">دوباره بگیرید</text></g>' +
        '<text x="160" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">نترسید؛ اغلب عدد دوم بهتر است</text>';

  };
  function art(id) { return ARTS[id] ? '<svg class="art" viewBox="0 0 320 180" role="img" aria-label="تصویر آموزشی" style="font-family:var(--font)">' + ARTS[id]() + '</svg>' : ''; }

  // ---------- نمودار روزانه سری: میانگین هر نوبت، با نوار هدف ----------
  function seriesChart(res, target) {
    var W = 640, H = 300, L = 44, R = 14, Tp = 16, B = 46, pts = [];
    res.days.forEach(function (d, i) {
      if (d.amMean) pts.push({ x: i - 0.2, s: d.amMean.sbp, d: d.amMean.dbp, am: true, dis: d.discarded });
      if (d.pmMean) pts.push({ x: i + 0.2, s: d.pmMean.sbp, d: d.pmMean.dbp, am: false, dis: d.discarded });
    });
    if (!pts.length) return '<p class="muted small">هنوز عددی برای نمودار ثبت نشده است.</p>';
    var lo = Math.min.apply(null, pts.map(function (p) { return p.d; }).concat(target ? [target.dbpLo || target.dbpHi] : [])), hi = Math.max.apply(null, pts.map(function (p) { return p.s; }).concat(target ? [target.sbpHi] : []));
    lo = Math.floor((lo - 8) / 10) * 10; hi = Math.ceil((hi + 8) / 10) * 10;
    var n = res.days.length, X = function (x) { return W - R - (x + 0.5) / n * (W - L - R); }, Y = function (v) { return Tp + (hi - v) / (hi - lo) * (H - Tp - B); };
    var g = '';
    g += '<rect x="' + X(0.5) + '" y="' + Tp + '" width="' + (X(-0.5) - X(0.5)) + '" height="' + (H - Tp - B) + '" fill="var(--line)" opacity=".35"/><text x="' + X(0) + '" y="' + (Tp + 13) + '" text-anchor="middle">تمرین</text>';
    if (target) {
      if (target.sbpLo != null) g += '<rect x="' + L + '" y="' + Y(target.sbpHi) + '" width="' + (W - L - R) + '" height="' + (Y(target.sbpLo) - Y(target.sbpHi)) + '" fill="var(--ok)" opacity=".13"/>';
      else g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(target.sbpHi) + '" y2="' + Y(target.sbpHi) + '" stroke="var(--ok)" stroke-dasharray="5 4"/>';
      if (target.dbpLo != null) g += '<rect x="' + L + '" y="' + Y(target.dbpHi) + '" width="' + (W - L - R) + '" height="' + (Y(target.dbpLo) - Y(target.dbpHi)) + '" fill="var(--ok)" opacity=".13"/>';
      else g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(target.dbpHi) + '" y2="' + Y(target.dbpHi) + '" stroke="var(--ok)" stroke-dasharray="5 4"/>';
    }
    for (var v = lo; v <= hi; v += 10) g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="var(--line)" stroke-width="' + (v % 20 ? .5 : 1) + '"/>' + (v % 20 ? '' : '<text x="' + (L - 6) + '" y="' + (Y(v) + 4) + '" text-anchor="end" direction="ltr">' + fa(v) + '</text>');
    res.days.forEach(function (d, i) { g += '<text x="' + X(i) + '" y="' + (H - B + 16) + '" text-anchor="middle">روز ' + fa(i + 1) + '</text><text x="' + X(i) + '" y="' + (H - B + 30) + '" text-anchor="middle" opacity=".8">' + date(d.date) + '</text>'; });
    function line(key, color) {
      var path = pts.map(function (p, i) { return (i ? 'L' : 'M') + X(p.x).toFixed(1) + ' ' + Y(p[key]).toFixed(1); }).join('');
      var o = '<path d="' + path + '" fill="none" stroke="' + color + '" stroke-width="2.5" stroke-linejoin="round"/>';
      pts.forEach(function (p) { o += '<circle cx="' + X(p.x).toFixed(1) + '" cy="' + Y(p[key]).toFixed(1) + '" r="4.5" fill="' + (p.am ? color : 'var(--surface)') + '" stroke="' + color + '" stroke-width="2.5"' + (p.dis ? ' opacity=".45"' : '') + '/>'; });
      return o;
    }
    g += line('s', 'var(--accent)') + line('d', 'var(--warn)');
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="نمودار فشار صبح و عصر در روزهای دوره">' + g + '</svg>' +
      '<div class="row small muted" style="justify-content:center;gap:16px"><span><b style="color:var(--accent)">●</b> سیستول</span><span><b style="color:var(--warn)">●</b> دیاستول</span><span>● صبح &nbsp; ○ عصر</span>' + (target ? '<span><b style="color:var(--ok)">▬</b> محدوده هدف</span>' : '') + '</div>';
  }
  function trendChart(list) { // میانگین سری‌های معتبر به ترتیب زمان
    var v = list.filter(function (r) { return r.valid && r.mean; });
    if (v.length < 2) return '';
    var W = 640, H = 170, L = 44, R = 20, Tp = 22, B = 30;
    var lo = Math.floor((Math.min.apply(null, v.map(function (r) { return r.mean.dbp; })) - 8) / 10) * 10, hi = Math.ceil((Math.max.apply(null, v.map(function (r) { return r.mean.sbp; })) + 8) / 10) * 10;
    var X = function (i) { return W - R - (i + 0.5) / v.length * (W - L - R); }, Y = function (x) { return Tp + (hi - x) / (hi - lo) * (H - Tp - B); }, g = '';
    for (var y = lo; y <= hi; y += 20) g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(y) + '" y2="' + Y(y) + '" stroke="var(--line)"/><text x="' + (L - 6) + '" y="' + (Y(y) + 4) + '" text-anchor="end" direction="ltr">' + fa(y) + '</text>';
    ['sbp', 'dbp'].forEach(function (k, ki) {
      var col = ki ? 'var(--warn)' : 'var(--accent)';
      g += '<path d="' + v.map(function (r, i) { return (i ? 'L' : 'M') + X(i) + ' ' + Y(r.mean[k]); }).join('') + '" fill="none" stroke="' + col + '" stroke-width="2.5"/>';
      v.forEach(function (r, i) { g += '<circle cx="' + X(i) + '" cy="' + Y(r.mean[k]) + '" r="' + (i === v.length - 1 ? 6 : 4) + '" fill="' + col + '"/><text x="' + X(i) + '" y="' + (Y(r.mean[k]) - 9) + '" text-anchor="middle" style="fill:var(--ink);font-weight:700">' + fa1(r.mean[k]) + '</text>'; });
    });
    v.forEach(function (r, i) { g += '<text x="' + X(i) + '" y="' + (H - 8) + '" text-anchor="middle">' + date(r.startDate) + '</text>'; });
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="روند میانگین دوره‌ها">' + g + '</svg>';
  }

  function interpretation(res, forPatient) {
    var c = res.classification, M = T.MSG;
    if (c.status === 'INSUFFICIENT') return M.INSUFFICIENT + ' (روز معتبر: ' + fa(res.validDays) + ' از ' + fa(res.need.validDays) + '، خوانش: ' + fa(res.n) + ' از ' + fa(res.need.readings) + ')';
    if (forPatient) return M[c.status] || '';
    if (c.mode === 'TREATED') return 'بیمار تحت درمان؛ مقایسه با هدف ' + (c.target.individual ? 'فردی' : 'کلینیک') + ' (' + targetText(c.target) + '). سیستول: ' + { IN: 'در محدوده', ABOVE: 'بالاتر', BELOW: 'پایین‌تر' }[c.sbp] + '؛ دیاستول: ' + { IN: 'در محدوده', ABOVE: 'بالاتر', BELOW: 'پایین‌تر' }[c.dbp] + '.';
    if (c.mode === 'DIAGNOSIS') return 'بیمار بدون درمان؛ مقایسه با آستانه تشخیص خانگی ≥' + fa(c.threshold.sbp) + '/' + fa(c.threshold.dbp) + ' (سیستول یا دیاستول).';
    return 'حالت بارداری: آستانه تشخیص خانگی تعریف نشده است؛ فقط قاعده «میانگین بالاتر از ۱۳۰/۸۰ ← مشورت با پزشک» اعمال می‌شود.';
  }

  // ---------- گزارش ویزیت یک‌صفحه‌ای ----------
  function report(res, ctx) {
    var p = ctx.patient, st = ctx.settings, staff = !!ctx.staff, h = '';
    var t = res.classification.target || (p.treated === false ? null : C.effectiveTarget(p, st));
    h += '<div class="row between"><div><h2>گزارش فشار خون خانگی</h2><div class="muted small">' + esc(st.clinicName) + ' · پروفایل CLINIC_NAJAFI_2026</div></div><div class="small muted">تاریخ گزارش: ' + dateFull(C.localParts(ctx.now || Date.now()).date) + '</div></div>';
    h += '<dl class="kv"><dt>بیمار</dt><dd>' + esc(p.name) + (p.nationalId ? ' · کد ملی <span class="num">' + fa(p.nationalId) + '</span>' : '') + '</dd>' +
      '<dt>مشخصات</dt><dd>' + [p.sex === 'F' ? 'زن' : (p.sex === 'M' ? 'مرد' : ''), ctx.age != null ? fa(ctx.age) + ' ساله' : '', p.treated === false ? 'بدون درمان (حالت تشخیص)' : 'تحت درمان'].concat((p.modes || []).map(function (m) { return MODE_FA[m]; })).filter(Boolean).join(' · ') + '</dd>';
    if (staff && p.device && (p.device.brand || p.device.type)) {
      var d = p.device, warn = [];
      if (d.type && d.type !== 'UPPER_ARM') warn.push('دستگاه بازویی نیست');
      if (d.validated === 'NO') warn.push('در فهرست معتبر پیدا نشد');
      if (d.year && ctx.yearNow && ctx.yearNow - d.year > 4) warn.push('بیش از ۴ سال کارکرد');
      if (p.armCircumference && d.cuffMin && (p.armCircumference < d.cuffMin || p.armCircumference > d.cuffMax)) warn.push('بازوبند اندازه بازو نیست');
      h += '<dt>دستگاه</dt><dd>' + esc(d.brand || '—') + (d.validated === 'YES' ? ' · معتبر (STRIDE BP)' : '') + (p.armCircumference ? ' · دور بازو ' + fa(p.armCircumference) + ' سانتی‌متر' : '') + (d.cuffMin ? ' · بازوبند ' + fa(d.cuffMin) + '–' + fa(d.cuffMax) : '') +
        (warn.length ? ' <span class="pill bad">' + warn.join('، ') + '</span>' : '') + '</dd>';
    }
    h += '<dt>دوره</dt><dd>' + date(res.startDate, true) + ' تا ' + date(res.endDate, true) + ' (' + fa(res.daysPlanned) + ' روز)' + (res.status === 'ACTIVE' ? ' <span class="pill warn">هنوز تمام نشده</span>' : '') + '</dd></dl>';

    h += '<div><h3>خلاصه</h3></div><div class="tiles"><div class="tile main"><b>' + (res.mean ? fa1(res.mean.sbp) + '/' + fa1(res.mean.dbp) : '—') + '</b><span>میانگین کل (mmHg)</span></div>' +
      '<div class="tile"><b>' + (res.meanAM ? fa1(res.meanAM.sbp) + '/' + fa1(res.meanAM.dbp) : '—') + '</b><span>میانگین صبح</span></div>' +
      '<div class="tile"><b>' + (res.meanPM ? fa1(res.meanPM.sbp) + '/' + fa1(res.meanPM.dbp) : '—') + '</b><span>میانگین عصر</span></div>' +
      '<div class="tile"><b>' + (res.min ? fa(res.min.sbp) + '–' + fa(res.max.sbp) : '—') + '</b><span>کمترین–بیشترین سیستول</span></div>' +
      '<div class="tile"><b>' + (res.min ? fa(res.min.dbp) + '–' + fa(res.max.dbp) : '—') + '</b><span>کمترین–بیشترین دیاستول</span></div>' +
      '<div class="tile"><b>' + fa(res.n) + ' / ' + fa(res.validDays) + '</b><span>خوانش / روز معتبر (پس از حذف روز ۱)</span></div>' +
      (res.mean && res.mean.pulse ? '<div class="tile"><b>' + fa(Math.round(res.mean.pulse)) + '</b><span>میانگین نبض</span></div>' : '') + '</div>';
    h += '<div class="stack-s"><div class="row">' + pill(res.classification.status) + (res.valid ? '' : '<span class="small muted">سری ناکافی طبقه‌بندی نمی‌شود (قاعده D1)</span>') + '</div><p>' + interpretation(res, !staff) + '</p>' +
      (staff ? '<p class="small muted">روز اول همیشه حذف می‌شود؛ مقایسه با عدد دقیق و بدون گردکردن؛ ۱۳۵ و ۸۰ خارج از هدف.' + (t && !t.individual && res.classification.mode === 'TREATED' ? ' هدف ISH 2026 (OPTIMAL) برای اطلاع: کمتر از ۱۳۰/۸۰.' : '') + '</p>' : '') + '</div>';
    if (res.night) h += '<div class="stack-s"><h3>فشار شبانه (دستگاه دارای حالت شب)</h3><p>' + (res.night.valid ? 'میانگین ' + bp(res.night.mean) + ' از ' + fa(res.night.n) + ' خوانش در ' + fa(res.night.nights) + ' شب. ' + (res.night.high ? '<span class="pill bad">≥۱۲۰/۷۰</span> برای تأیید تکرار شود.' : '<span class="pill ok">کمتر از ۱۲۰/۷۰</span>') : fa(res.night.n) + ' خوانش در ' + fa(res.night.nights) + ' شب؛ دست‌کم ۶ خوانش در ۲ شب لازم است.') + '</p></div>';
    if (staff && ctx.phenotype && ctx.phenotype.code) h += '<div class="stack-s"><h3>مقایسه با فشار مطب</h3><p>فشار مطب ' + bpInt(ctx.phenotype.office) + ' (' + date(ctx.phenotype.office.date) + ') ← <b>' + PHENO[ctx.phenotype.code] + '</b>. با اندازه‌گیری‌های تکراری مطب و خارج از مطب تأیید شود.</p></div>';
    if (staff && res.others && res.others.length) {
      h += '<div class="stack-s"><h3>سایر راهنماها چه می‌گویند</h3><p class="small muted">تعارض‌ها نشان داده می‌شود، حل نمی‌شود. همان میانگین (روزهای ۲ به بعد) با آستانه و هدف هر راهنما.</p><div class="tw"><table><tr><th>راهنما</th><th>تشخیص</th><th>هدف درمان</th></tr>' +
        res.others.map(function (o) { return '<tr><td><b>' + o.name + '</b></td><td style="white-space:normal">' + o.diagnosis + '</td><td style="white-space:normal">' + o.target + '</td></tr>'; }).join('') + '</table></div></div>';
    }
    h += '<div class="stack-s"><h3>نمودار روزانه</h3>' + seriesChart(res, t) + '</div>';
    if (ctx.trend && ctx.trend.length) {
      var v = ctx.trend.filter(function (r) { return r.valid && r.mean; }), inT = v.filter(function (r) { return r.classification.status === 'IN_TARGET'; }).length, tc = trendChart(ctx.trend);
      if (tc) h += '<div class="stack-s"><h3>روند دوره‌های قبلی</h3>' + tc + (p.treated === false ? '' : '<p class="small muted">' + fa(inT) + ' از ' + fa(v.length) + ' دوره معتبر در محدوده هدف (شاخص داخلی کلینیک؛ راهنماها آستانه‌ای برای آن ندارند).</p>') + '</div>';
    }
    var q = res.quality;
    h += '<div class="stack-s"><h3>کیفیت اندازه‌گیری</h3><div class="row">' +
      '<span class="pill ' + (q.missedOccasions ? 'warn' : 'ok') + '">نوبت جامانده: ' + fa(q.missedOccasions) + '</span><span class="pill ' + (q.restSkipped ? 'warn' : 'ok') + '">تایمر استراحت رد شد: ' + fa(q.restSkipped) + '</span>' +
      '<span class="pill ' + (q.outOfWindow ? 'warn' : 'ok') + '">خارج از بازه زمانی: ' + fa(q.outOfWindow) + '</span><span class="pill ' + (q.singleOccasions ? 'warn' : 'ok') + '">نوبت ناقص: ' + fa(q.singleOccasions) + '</span>' +
      (q.extraReadings ? '<span class="pill gray">خوانش اضافه: ' + fa(q.extraReadings) + '</span>' : '') + (q.paper ? '<span class="pill gray">ورود از برگه: ' + fa(q.paper) + '</span>' : '') + '</div></div>';
    if (staff && ctx.alerts && ctx.alerts.length) {
      var al = ctx.alerts.filter(function (a) { var dd = C.localParts(a.createdAt).date; return dd >= res.startDate && dd <= res.endDate; });
      if (al.length) h += '<div class="stack-s"><h3>هشدارها و علائم در این دوره</h3>' + al.map(function (a) {
        return '<p class="small">' + dateTime(a.createdAt) + ' — <b>' + ALERT_FA[a.code] + '</b>' + (a.readings.length ? ' · ' + a.readings.map(bpInt).join(' و ') : '') + (a.symptoms.length ? ' · ' + a.symptoms.map(T.symptomFa).join('، ') : '') + (a.note ? ' · یادداشت: ' + esc(a.note) : '') + '</p>'; }).join('') + '</div>';
    }
    h += '<div class="stack-s"><h3>همه خوانش‌ها</h3><div class="tw"><table><tr><th>روز</th><th>تاریخ</th><th>نوبت</th><th class="n">ساعت</th><th class="n">فشار</th><th class="n">نبض</th><th>برچسب</th>' + (ctx.canDelete ? '<th></th>' : '') + '</tr>';
    res.days.forEach(function (d) {
      d.am.concat(d.pm).forEach(function (r) {
        var tags = [];
        if (d.discarded) tags.push('روز تمرین، حساب نمی‌شود');
        if (r.outOfWindow) tags.push('خارج از بازه'); if (r.restSkipped) tags.push('بدون تایمر استراحت'); if (r.source === 'PAPER') tags.push('برگه');
        if (r.alertState) tags.push({ PENDING: 'در انتظار تکرار', NOT_CONFIRMED: 'هشدار تأیید نشد', CONFIRMED: 'هشدار تأیید شد', SYMPTOMS: 'با علائم', NO_REPEAT: 'تکرار نشد' }[r.alertState] || '');
        var oor = C.outOfRange(r.sbp, st);
        h += '<tr class="' + (d.discarded ? 'gray' : '') + (oor ? ' flag' : '') + '"><td>' + fa(d.index) + '</td><td>' + date(d.date) + '</td><td>' + (r.slot === 'MORNING' ? 'صبح' : 'عصر') + '</td><td class="n">' + time(r.takenAt) + '</td><td class="n"><b>' + bpInt(r) + '</b></td><td class="n">' + (r.pulse != null ? fa(r.pulse) : '') + '</td><td class="small">' + tags.join('، ') + '</td>' +
          (ctx.canDelete ? '<td><button class="link small noprint" data-act="del-reading" data-id="' + esc(r.id) + '">حذف</button></td>' : '') + '</tr>';
      });

      },
      print: function () { if (opts.noPrint) toast('چاپ در نسخه نمایشی غیرفعال است؛ در سامانه نصب‌شده، گزارش چاپ یا PDF می‌شود.'); else root.print(); },
      plan: function (b) { go('plan', { move: b.dataset.move || null }); },
      ask: function (b) { ask(b.dataset.q); },

        catch (e) { toast('این مرورگر اعلان را پشتیبانی نمی‌کند.'); }
      }
    };
    el.addEventListener('click', function (e) {

      if (b.tagName !== 'A') e.preventDefault();
      var f = acts[b.dataset.act]; if (f) f(b);

    el.addEventListener('submit', function (e) { e.preventDefault(); var f = forms[e.target.dataset.form]; if (f) f(); });

    // یادآوری نوبت (تا وقتی برنامه باز است) + همگام‌سازی دوره‌ای
    function remindCheck() {
      if (!S.remind || !D() || !D().patient) return;
      var t = today(), ser = C.seriesForDate(D().series, t.date); if (!ser) return;
      var slot = t.minutes >= 450 && t.minutes < 660 ? 'MORNING' : (t.minutes >= 1170 && t.minutes < 1380 ? 'EVENING' : null), key = t.date + slot;

      S.notified = {}; S.notified[key] = 1; save();

        patchPatient({ treated: val('c-tr') === '1', modes: modes, longTerm: val('c-lt'), measurementArm: val('c-arm') || null, fistulaArm: val('c-fis') || null, assisted: val('c-as'), needsReview: false }, 'وضعیت بالینی ذخیره شد.');
      },
      target: function () { patchPatient({ individualTarget: { sbpLo: val('t-slo'), sbpHi: val('t-shi'), dbpLo: val('t-dlo'), dbpHi: val('t-dhi') } }, 'هدف فردی ثبت شد.'); },
      profile: function () { patchPatient({ name: val('p-name'), mobile: val('p-mob'), birthYear: val('p-by'), sex: val('p-sex') || null, extraMobiles: val('p-em').split(/[,،\s]+/).filter(Boolean) }, 'مشخصات ذخیره شد.'); },
      device: function () { patchPatient({ armCircumference: val('d-arm'), device: { brand: val('d-brand'), type: val('d-type'), validated: val('d-val'), year: val('d-year'), cuffMin: val('d-cmin'), cuffMax: val('d-cmax'), nightMode: val('d-night') } }, 'دستگاه ذخیره شد.'); },
      office: async function () {
        var b = parseBp(val('o-bp')); if (!b) { V.err = 'فشار مطب را به شکل 148/94 بنویسید.'; return render(); }
        try { await api('POST', '/api/staff/patients/' + V.id + '/office', b); await load('patient', { id: V.id }); toast('فشار مطب ثبت شد.'); } catch (e) { V.err = e.message; render(); }
      },
      paper: async function () {
        var entries = [], bad = 0;
        for (var i = 0; el.querySelector('#pp-' + i + '-date'); i++) {
          [['a1', 'amt', 0], ['a2', 'amt', 2], ['p1', 'pmt', 0], ['p2', 'pmt', 2]].forEach(function (k, j) {
            var raw = val('pp-' + i + '-' + k[0]); if (!raw.trim()) return;
            var b = parseBp(raw); if (!b) { bad++; return; }
            entries.push({ date: val('pp-' + i + '-date'), time: addMin(val('pp-' + i + '-' + k[1]), k[2]), sbp: b.sbp, dbp: b.dbp, seq: j % 2 + 1 });
          });
        }
        if (!entries.length) { V.err = bad ? 'عددها را به شکل 128/78 بنویسید.' : 'عددی وارد نشده است.'; return render(); }
        try { var r = await api('POST', '/api/staff/patients/' + V.id + '/readings', { entries: entries }); await load('patient', { id: V.id }); toast(fa(r.saved) + ' عدد ثبت شد' + (r.errors.length + bad ? '؛ ' + fa(r.errors.length + bad) + ' مورد نادرست بود.' : '.')); }
        catch (e) { V.err = e.message; render(); }
      },
      settings: async function () {
        try {
          settings = (await api('PUT', '/api/staff/settings', { clinicName: val('s-name'), clinicPhone: C.toEnDigits(val('s-phone')).trim(), onCallMobiles: val('s-oncall').split(/[,،\s]+/).filter(Boolean),
            hours: { days: settings.hours.days, from: Number(C.toEnDigits(val('s-from'))) || 8, to: Number(C.toEnDigits(val('s-to'))) || 20 }, series: { defaultOffset: Number(C.toEnDigits(val('s-off'))) || 0 }, appUrl: val('s-url').trim(),
            integrationKey: val('s-ikey').trim(), llm: { url: val('s-lurl').trim(), model: val('s-lmodel').trim(), key: val('s-lkey').trim() } })).settings;
          toast('تنظیمات ذخیره شد.');
        } catch (e) { V.err = e.message; render(); }
      },
      export: async function () {
        try {
          var from = C.addDays(C.localParts(now()).date, -(Number(val('ex-d')) || 90)), rows = (await api('GET', '/api/staff/export', null, { from: from })).rows;
          var csv = 'nationalId,name,startDate,endDate,readings,validDays,valid,meanSBP,meanDBP,status\n' + rows.map(function (r) { return [r.nationalId, '"' + String(r.name).replace(/"/g, '""') + '"', r.startDate, r.endDate, r.n, r.validDays, r.valid, r.sbp, r.dbp, r.status].join(','); }).join('\n');
          V.csv = csv; render();
          if (!opts.noDownload) { var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = 'hbpm-series.csv'; a.click(); }
        } catch (e) { V.err = e.message; render(); }
      },
      newuser: async function () {
        try { await api('POST', '/api/staff/users', { name: val('u-name'), username: val('u-user'), password: val('u-pass'), role: val('u-role') }); await load('users'); toast('کاربر ساخته شد.'); } catch (e) { V.err = e.message; render(); }
      },
      media: async function () {
        try {
          var f = el.querySelector('#m-file'), file = f && f.files && f.files[0], url = val('m-url').trim(), kind = 'embed';
          if (file && opts.upload) { var up = await opts.upload(file, S.token); url = up.url; kind = up.kind; }
          else if (/\.(mp4|webm)(\?|$)/i.test(url)) kind = 'video';
          await api('POST', '/api/staff/media', { title: val('m-title') || (file ? file.name : ''), url: url, kind: kind, screen: val('m-screen') }); await load('media'); toast('اضافه شد.');
        } catch (e) { V.err = e.message; render(); }
      }
    };
    var acts = {
      tab: function (b) { load(b.dataset.t); }, open: function (b) { load('patient', { id: b.dataset.id }); },
      report: function (b) { load('report', { id: b.dataset.id, sid: b.dataset.sid }); },
      logout: function () { S = { token: null, staff: null }; save(); V = { name: 'login' }; render(); },
      ack: async function (b) { try { await api('POST', '/api/staff/alerts/' + b.dataset.id + '/ack', { note: val('note-' + b.dataset.id) }); load('dash'); } catch (e) { toast(e.message); } },
      'cancel-series': async function (b) { try { await api('POST', '/api/staff/series/' + b.dataset.sid + '/cancel', {}); await load('patient', { id: V.id }); toast('دوره لغو شد.'); } catch (e) { toast(e.message); } },
      review: async function (b) { try { await api('POST', '/api/staff/series/' + b.dataset.sid + '/review', { note: val('rv-note') }); await load('report', { id: V.id, sid: V.sid }); toast('بازبینی ثبت شد.'); } catch (e) { toast(e.message); } },
      'clear-target': function () { patchPatient({ individualTarget: null }, 'هدف کلینیک برقرار شد.'); },
      'del-reading': async function (b) { try { await api('POST', '/api/staff/readings/' + b.dataset.id + '/delete', { reason: 'حذف توسط پزشک' }); await load('report', { id: V.id, sid: V.sid }); toast('عدد حذف شد (در سابقه ثبت می‌ماند).'); } catch (e) { toast(e.message); } },
      print: function () { if (opts.noPrint) toast('چاپ در نسخه نمایشی غیرفعال است؛ در سامانه نصب‌شده، گزارش چاپ یا PDF می‌شود.'); else root.print(); },
      'user-toggle': async function (b) { try { await api('PATCH', '/api/staff/users/' + b.dataset.id, { active: b.dataset.active === '1' }); load('users'); } catch (e) { toast(e.message); } },
      'media-del': async function (b) { try { await api('DELETE', '/api/staff/media/' + b.dataset.id); load('media'); } catch (e) { toast(e.message); } }
    };
    el.addEventListener('click', function (e) { var b = e.target.closest('[data-act]'); if (!b || !el.contains(b)) return; e.preventDefault(); var f = acts[b.dataset.act]; if (f) f(b); });
    el.addEventListener('submit', function (e) { e.preventDefault(); var f = forms[e.target.dataset.form]; if (f) { V.err = null; f(); } });
    el.addEventListener('input', function (e) {
      if (e.target.id !== 'so') return; var o = el.querySelector('#so-date'), n = Number(e.target.value);
      if (o && isFinite(n)) o.innerHTML = 'شروع: <b>' + U.date(C.addDays(C.localParts(now()).date, n), true) + '</b>';
    });
    var poll = setInterval(function () { if (S.token && V.name === 'dash' && !el.querySelector('input:focus')) load('dash'); }, 60000);

    if (S.token) { api('GET', '/api/staff/me').then(function (r) { settings = r.settings; S.staff = r.staff; load('dash'); }).catch(function () { render(); }); } else render();
    return { destroy: function () { clearInterval(poll); el.innerHTML = ''; }, reload: function () { if (S.token) load(V.name === 'login' ? 'dash' : V.name, { id: V.id, sid: V.sid, q: V.q }); } };
  }
  root.HBPMClinicApp = { mount: mount };
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
/* راه‌اندازی نسخه نمایشی: همان کد سامانه، با انبار درون‌حافظه‌ای و داده نمونه. هیچ داده‌ای جایی فرستاده نمی‌شود. */
(async function () {
  var C = HBPMCore, U = HBPMUi, n = 0, smsBox = [];
  var api = HBPMApi.createApi({ store: HBPMMemStore(), randomId: function () { return 'd' + (++n) + Math.random().toString(36).slice(2, 8); }, randomCode: function () { return '12345'; },
    devOtp: true, hash: function (p) { return 'h:' + p; }, verify: function (p, h) { return h === 'h:' + p; }, sms: function (m, t, k) { smsBox.unshift({ m: m, t: t, k: k, at: Date.now() }); } });
  async function call(method, path, body, token, query) { var r = await api.handle({ method: method, path: path, body: body ? JSON.parse(JSON.stringify(body)) : {}, token: token, query: query || {} }); return { status: r.status, json: JSON.parse(JSON.stringify(r.json)) }; }
  async function ok(method, path, body, token) { var r = await call(method, path, body, token); if (r.status !== 200) throw new Error(path + ' ' + JSON.stringify(r.json)); return r.json; }

  // ---------- داده نمونه ----------
  api.ensureAdmin('admin', 'demo1234', 'دکتر نجفی (نمونه)');
  var admin = (await ok('POST', '/api/staff/login', { username: 'admin', password: 'demo1234' }));
  await ok('POST', '/api/staff/users', { username: 'gp1', name: 'پزشک عمومی نمونه', role: 'gp', password: 'demo1234' }, admin.token);
  await ok('POST', '/api/staff/users', { username: 'nurse1', name: 'پرستار نمونه', role: 'nurse', password: 'demo1234' }, admin.token);
  await ok('PUT', '/api/staff/settings', { clinicPhone: '02100000000', onCallMobiles: ['09120000000'] }, admin.token);
  var today = C.localParts(Date.now()), seed = 7;
  function rnd() { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648 - 0.5; }
  function gen(start, days, s, d, upToMs) {
    var out = [];
    for (var i = 0; i < days; i++) [[7 * 60 + 5, 3], [7 * 60 + 7, 1], [19 * 60 + 10, -2], [19 * 60 + 12, -4]].forEach(function (x, j) {
      var at = C.dateToMs(C.addDays(start, i), x[0]); if (at > upToMs) return;
      out.push({ id: 's' + (++n), takenAt: at, sbp: Math.round(s + x[1] + (i === 0 ? 9 : 0) + rnd() * 10), dbp: Math.round(d + x[1] / 2 + (i === 0 ? 4 : 0) + rnd() * 7), pulse: Math.round(70 + rnd() * 10), seq: j % 2 + 1 });
    });
    return out;
  }
  async function patient(name, nid, mobile, by, sex, patch) {
    var p = (await ok('POST', '/api/staff/patients', { name: name, nationalId: nid, mobile: mobile, birthYear: by, sex: sex }, admin.token)).patient;
    if (patch) await ok('PATCH', '/api/staff/patients/' + p.id, patch, admin.token);
    await ok('POST', '/api/auth/otp', { mobile: mobile });
    p.token = (await ok('POST', '/api/auth/verify', { mobile: mobile, code: '12345' })).token; return p;
  }
  async function series(p, offset, days, s, d, review) {
    var se = (await ok('POST', '/api/staff/patients/' + p.id + '/series', { startDate: C.addDays(today.date, offset), days: days }, admin.token)).series;
    if (s) await ok('POST', '/api/p/' + p.id + '/sync', { readings: gen(se.startDate, days, s, d, Date.now() - 20 * 60000), consentAt: Date.now(), eduDoneAt: Date.now() }, p.token);
    if (review) await ok('POST', '/api/staff/series/' + se.id + '/review', { note: 'نمونه' }, admin.token);
    return se;
  }
  var A = await patient('حسین رضایی (نمونه)', '0499370899', '09120000001', 1338, 'M', { measurementArm: 'LEFT', armCircumference: 31, longTerm: 'PRE_VISIT_7D', device: { brand: 'فشارسنج بازویی نمونه', type: 'UPPER_ARM', validated: 'YES', year: 1403, cuffMin: 22, cuffMax: 42 } });
  await series(A, -92, 7, 149, 91, true); await series(A, -47, 7, 141, 86, true); await series(A, -2, 7, 133, 81);
  var B = await patient('مریم احمدی (نمونه)', '0012345679', '09120000002', 1352, 'F', { extraMobiles: ['09120000001'] });
  await series(B, -40, 7, 138, 84, true); await series(B, -7, 7, 128, 76);
  await ok('POST', '/api/staff/patients/' + B.id + '/office', { sbp: 146, dbp: 88 }, admin.token);
  var Cp = await patient('علی کریمی (نمونه)', '1234567891', '09120000003', 1318, 'M', { modes: ['OLDER_FRAIL'], assisted: true, individualTarget: { sbpLo: 130, sbpHi: 150, dbpLo: '', dbpHi: 90 }, device: { brand: 'فشارسنج قدیمی نمونه', type: 'UPPER_ARM', validated: 'UNKNOWN', year: 1397 } });
  await series(Cp, -11, 7, 143, 77);
  var t0 = Date.now() - 50 * 60000;
  await ok('POST', '/api/p/' + Cp.id + '/sync', { readings: [{ id: 'x1', takenAt: t0, sbp: 182, dbp: 96, alertState: 'CONFIRMED' }, { id: 'x2', takenAt: t0 + 6 * 60000, sbp: 176, dbp: 94, alertState: 'CONFIRMED', repeatOf: 'x1' }],
    alerts: [{ id: 'xa', code: 'D3_REPEAT_OUT_OF_RANGE', readings: [{ sbp: 182, dbp: 96 }, { sbp: 176, dbp: 94 }], createdAt: t0 + 6 * 60000 }] }, Cp.token);
  await ok('POST', '/api/auth/otp', { mobile: '09120000004' });
  var dTok = (await ok('POST', '/api/auth/verify', { mobile: '09120000004', code: '12345' })).token;
  var Dp = (await ok('POST', '/api/patients/link', { name: 'زهرا موسوی (نمونه)', nationalId: '0084575948', birthYear: 1360, sex: 'F' }, dTok)).patient;
  await ok('POST', '/api/p/' + Dp.id + '/series', { startDate: C.addDays(today.date, 5), days: 7 }, dTok);
  smsBox.length = 0;

  // ---------- نصب دو نما ----------
  var st = await ok('GET', '/api/p/' + A.id + '/state', null, A.token), me = await ok('GET', '/api/me', null, A.token), data = {};
  data[A.id] = { patient: st.patient, series: st.series, readings: st.readings, settings: st.settings, media: [], q: { readings: [], patches: [], alerts: [] }, consentAt: st.patient.consentAt, eduDoneAt: st.patient.eduDoneAt, seen: {} };
  var common = { memoryOnly: true, noPrint: true, noDownload: true };
  HBPMPatientApp.mount(document.getElementById('pv'), call, Object.assign({ initial: { token: A.token, mobile: '09120000001', patients: me.patients, currentId: A.id, data: data, remind: false, notified: {} } }, common));
  var clinic = HBPMClinicApp.mount(document.getElementById('cv'), call, Object.assign({ initial: { token: admin.token, staff: admin.staff },
    loginHint: 'نسخه نمایشی — رمز همه: demo1234 · پزشک اصلی: admin · پزشک عمومی: gp1 · پرستار: nurse1' }, common));

  var sv = document.getElementById('sv');
  function show(which) {
    ['pv', 'cv', 'sv'].forEach(function (id) { document.getElementById(id).hidden = id !== which; });
    Array.prototype.forEach.call(document.querySelectorAll('.demo-switch button'), function (b) { b.setAttribute('aria-current', b.dataset.v === which); });
    if (which === 'cv') clinic.reload();
    if (which === 'sv') sv.innerHTML = '<div class="app"><div class="view"><h1>پیامک‌های آزمایشی</h1><p class="muted small">در نسخه نمایشی پیامکی فرستاده نمی‌شود؛ متن‌ها اینجا دیده می‌شود. کد ورود همیشه ۱۲۳۴۵ است.</p>' +
      (smsBox.length ? smsBox.map(function (s) { return '<div class="card"><div class="row between"><span class="pill ' + (s.k === 'ALERT' ? 'bad' : 'gray') + '">' + ({ OTP: 'کد ورود', ALERT: 'هشدار به کشیک', SERIES: 'یادآوری دوره' }[s.k] || s.k) + '</span><span class="num small">' + U.fa(s.m) + ' · ' + U.time(s.at) + '</span></div><p>' + U.esc(s.t) + '</p></div>'; }).join('') : '<p class="muted">هنوز پیامکی نیست. در نمای بیمار یک عدد ۱۷۰ یا بالاتر ثبت و تکرار کنید تا پیامک کشیک را ببینید.</p>') + '</div></div>';
    try { window.scrollTo(0, 0); } catch (e) { /* بدون اسکرول */ }
  }
  document.querySelector('.demo-switch').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) show(b.dataset.v); });
  setInterval(function () { api.tick(); }, 30000);
  show('pv');
})().catch(function (e) { document.getElementById('pv').innerHTML = '<p style="padding:16px">خطا در راه‌اندازی نسخه نمایشی: ' + String(e && e.message || e) + '</p>'; });

</script>
</body>
